  <main class="game-view" id="view-AsteroidSurfer">
    <!-- Telemetry Strip -->
    <section class="card">
      <div class="card-title">
        <span>Surfer Telemetry</span>
        <span id="asStateBadge" style="color:#60a5fa; font-size:0.75rem;">START</span>
      </div>
      <div class="telemetry-grid-3">
        <div class="telem-item">
          <div class="telem-label">Speed</div>
          <div class="telem-val" id="asSpeed" style="color:#fb923c;">0 km/h</div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Multiplier</div>
          <div class="telem-val" id="asMultiplier" style="color:#34d399;">1.0x</div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Air-Time</div>
          <div class="telem-val" id="asAirTime" style="color:#38bdf8;">0.0s</div>
        </div>
      </div>
      <div class="telemetry-grid-2" style="margin-top:8px;">
        <div class="telem-item">
          <div class="telem-label">Cosmic Dust</div>
          <div class="telem-val" id="asCosmicDust" style="color:var(--gold);">0</div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Altitude / Lip</div>
          <div class="telem-val" id="asLipHeight" style="color:#f472b6;">0.0m</div>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:0.75rem; font-weight:700; color:var(--text-muted);">
        <span>Score: <strong id="asScore" style="color:var(--gold); font-size:0.85rem;">0</strong></span>
        <span id="asWaveStatusBadge" style="color:#38bdf8; font-weight:800; background:rgba(56,189,248,0.12); padding:3px 8px; border-radius:6px; border:1px solid rgba(56,189,248,0.3);">🌊 ON WAVE</span>
      </div>
    </section>

    <!-- 2D Surf Carve Visualizer -->
    <section class="card">
      <div class="card-title">
        <span>Surf Carve Visualizer (Wave Profile)</span>
        <span id="asRateLabel" style="font-size:0.7rem; color:#34d399;">-- Hz</span>
      </div>
      <div style="position:relative; width:100%; height:180px; background:radial-gradient(ellipse at 50% 120%, rgba(56, 189, 248, 0.15), rgba(9, 13, 22, 0.8) 75%); border:1px solid rgba(255,255,255,0.08); border-radius:14px; overflow:hidden;">
        <canvas id="asSurfCanvas" width="340" height="180" style="width:100%; height:100%; display:block;"></canvas>
      </div>
      <div class="cal-readouts" style="margin-top:10px;">
        <div>BANK ANGLE: <span id="asBankDeg" style="color:#38bdf8;">+0.0°</span></div>
        <div>LIP ELEVATION: <span id="asAltitudeVal" style="color:#f472b6;">0.0m</span></div>
      </div>
      <div class="cal-actions" style="margin-top:10px;">
        <button class="btn-tare" onclick="sendWsMessage({ type: 'tare_board' })">🎯 Tare Zero (Set Level)</button>
        <button class="btn-secondary" onclick="sendWsMessage({ type: 'reset_cal' })">Reset Zero</button>
      </div>
    </section>

    <!-- Interactive Controls Deck -->
    <section class="card">
      <div class="card-title">
        <span>Wave & Carve Controls</span>
      </div>
      <div class="slider-row">
        <span style="font-size:0.75rem; font-weight:700; color:var(--text-muted);">Wave Speed:</span>
        <input type="range" id="asWaveSpeedSlider" min="15" max="50" step="1" value="28" oninput="onWaveSpeedInput(this.value)">
        <span id="asWaveSpeedText" style="font-size:0.8rem; font-weight:800; min-width:54px; color:#38bdf8;">28 km/h</span>
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label class="form-label" style="font-size:0.72rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:4px;">Cosmic Density (Asteroid Field)</label>
        <div class="invert-deck" style="grid-template-columns: repeat(3, 1fr); margin-top:4px;">
          <button class="btn-toggle" id="asDensityLow" onclick="setCosmicDensity('low')">Low</button>
          <button class="btn-toggle active" id="asDensityMedium" onclick="setCosmicDensity('medium')">Medium</button>
          <button class="btn-toggle" id="asDensityHigh" onclick="setCosmicDensity('high')">High</button>
        </div>
      </div>
      <div class="slider-row" style="margin-top:12px;">
        <span style="font-size:0.75rem; font-weight:700; color:var(--text-muted);">Carve Sensitivity:</span>
        <input type="range" id="asSensitivitySlider" min="0.5" max="2.5" step="0.1" value="1.0" oninput="onSensitivityInput(this.value)">
        <span id="asSensitivityText" style="font-size:0.8rem; font-weight:800; min-width:36px;">1.0x</span>
      </div>
      <div class="invert-deck" style="margin-top:10px;">
        <button class="btn-toggle active" id="asBtnInvertRoll" onclick="toggleInvert('roll')">Invert Carve Roll</button>
        <button class="btn-toggle active" id="asBtnInvertPitch" onclick="toggleInvert('pitch')">Invert Dive Pitch</button>
      </div>
    </section>
  </main>
