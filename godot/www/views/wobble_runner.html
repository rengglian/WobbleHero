  <main class="game-view" id="view-WobbleRunner">
    <!-- Telemetry Strip -->
    <section class="card">
      <div class="card-title">
        <span>Runner Telemetry</span>
        <span id="wrSeedBadge" style="color:#facc15; font-weight:800; font-size:0.75rem;">Seed: 1337</span>
      </div>
      <div class="telemetry-grid-4">
        <div class="telem-item">
          <div class="telem-label">Score</div>
          <div class="telem-val" id="wrScore" style="color:var(--gold);">0</div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Distance</div>
          <div class="telem-val" id="wrDistance" style="color:#38bdf8;">0m</div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Speed</div>
          <div class="telem-val" id="wrSpeed" style="color:#fb923c;">0 km/h</div>
        </div>
        <div class="telem-item">
          <div class="telem-label">Multiplier</div>
          <div class="telem-val" id="wrMultiplier" style="color:#34d399;">1x</div>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:0.75rem; font-weight:700; color:var(--text-muted);">
        <span>🍏 Apples: <strong id="wrApples" style="color:#f87171;">0</strong></span>
        <span>🧲 Horseshoes: <strong id="wrHorseshoes" style="color:#fbbf24;">0</strong></span>
      </div>
    </section>

    <!-- Slalom Steering & Lane Visualizer -->
    <section class="card">
      <div class="card-title">
        <span>Slalom Steering Tilt</span>
        <span id="wrSteerDeg" style="color:#38bdf8; font-weight:800;">+0.0°</span>
      </div>
      <div class="slalom-track">
        <div class="slalom-lane-marker" style="left: 20%;"></div>
        <div class="slalom-lane-marker" style="left: 50%;"></div>
        <div class="slalom-lane-marker" style="left: 80%;"></div>
        <span class="slalom-lane-label" style="left: 20%;">LEFT</span>
        <span class="slalom-lane-label" style="left: 50%;">CENTER</span>
        <span class="slalom-lane-label" style="left: 80%;">RIGHT</span>
        <div class="slalom-rider" id="wrRiderPuck" style="left: 50%;">🏇</div>
      </div>
      <div class="slider-row">
        <span style="font-size:0.75rem; font-weight:700; color:var(--text-muted);">Steer Sensitivity:</span>
        <input type="range" id="wrSensitivitySlider" min="0.5" max="2.5" step="0.1" value="1.0" oninput="onSensitivityInput(this.value)">
        <span id="wrSensitivityText" style="font-size:0.8rem; font-weight:800; min-width:36px;">1.0x</span>
      </div>
      <div class="invert-deck" style="margin-top:8px;">
        <button class="btn-toggle active" id="wrBtnInvertRoll" onclick="toggleInvert('roll')" style="grid-column: span 2;">Invert Steering Direction</button>
      </div>
    </section>

    <!-- Runner Deterministic Seed & Rider Controls -->
    <section class="card">
      <div class="card-title">
        <span>Rider & Deterministic Seed</span>
      </div>
      <div class="runner-controls">
        <div class="form-group">
          <label class="form-label" for="wrPlayerNameInput">Rider Name</label>
          <div class="input-row">
            <input type="text" id="wrPlayerNameInput" class="text-input" placeholder="Hero 1" maxlength="16" />
            <button class="btn-action-small" onclick="savePlayerName()">Save Name</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="wrSeedInput">Track Seed</label>
          <div class="input-row">
            <input type="number" id="wrSeedInput" class="text-input" value="1337" />
            <button class="btn-action-small" onclick="applySeed()">Apply</button>
            <button class="btn-action-small" style="background:rgba(234, 179, 8, 0.15); border-color:#eab308; color:#fef08a;" onclick="randomizeSeed()">🎲 Random</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Leaderboard Table -->
    <section class="card">
      <div class="card-title">
        <span>Top 10 High Scores</span>
        <button class="btn-secondary" style="padding:4px 8px; font-size:0.7rem; border-radius:6px;" onclick="resetLeaderboard()">Reset</button>
      </div>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th style="text-align:right;">Score</th>
            <th style="text-align:right;">Dist</th>
            <th style="text-align:right;">Seed</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:16px;">Loading leaderboard...</td></tr>
        </tbody>
      </table>
    </section>
  </main>
