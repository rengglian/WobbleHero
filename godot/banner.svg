<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bannerText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bannerBg)"/>
  <!-- Pivot and Board -->
  <polygon points="160,125 140,155 180,155" fill="#f59e0b"/>
  <g transform="rotate(-8 160 120)">
    <rect x="70" y="112" width="180" height="16" rx="8" fill="url(#bannerText)"/>
    <circle cx="160" cy="85" r="20" fill="#10b981" stroke="#34d399" stroke-width="4"/>
    <circle cx="154" cy="79" r="6" fill="#ffffff" opacity="0.8"/>
  </g>
  <text x="160" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">WOBBLE HERO</text>
  <text x="160" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">BALANCE BOARD GAMING</text>
</svg>
