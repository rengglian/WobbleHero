<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Pivot Fulcrum -->
  <polygon points="64,84 48,106 80,106" fill="#f59e0b"/>
  <!-- Tilting Balance Board Deck -->
  <g transform="rotate(-12 64 80)">
    <rect x="20" y="74" width="88" height="12" rx="6" fill="url(#boardGrad)"/>
    <!-- Hero / Ball in motion -->
    <circle cx="64" cy="56" r="14" fill="#10b981" stroke="#34d399" stroke-width="3"/>
    <circle cx="60" cy="52" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Motion arcs -->
  <path d="M 28 66 A 48 48 0 0 1 100 66" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
</svg>
